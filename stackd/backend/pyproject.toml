[project]
name = "stackd"
version = "0.1.0"
description = "NFL player-prop edge finder and parlay builder (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "nflreadpy>=0.1.5",
  "polars>=1.0",
  "pyarrow>=15",
  "httpx>=0.27",
  "rapidfuzz>=3.0",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stackd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
